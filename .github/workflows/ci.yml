name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: camp_bath_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:password@localhost:5432/camp_bath_test
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Set up database
        run: |
          bin/rails db:create
          bin/rails db:schema:load

      - name: Diagnose test environment
        run: |
          echo "===== ENV ====="
          echo "CI=$CI"
          echo "RAILS_ENV=$RAILS_ENV"
          echo "DATABASE_URL is set: ${DATABASE_URL:+yes}"

          echo ""
          echo "===== Ruby ====="
          ruby -v
          bundle -v

          echo ""
          echo "===== Rails ====="
          bin/rails -v

          echo ""
          echo "===== Chrome ====="
          which google-chrome || true
          google-chrome --version || true
          which chromium || true
          chromium --version || true

          echo ""
          echo "===== ChromeDriver ====="
          which chromedriver || true
          chromedriver --version || true

          echo ""
          echo "===== Network ====="
          hostname
          hostname -I || true
          ip addr || true

          echo ""
          echo "===== Port 4444 ====="
          ss -ltnp | grep ':4444' || true

          echo ""
          echo "===== Chrome processes ====="
          ps aux | grep -E 'chrome|chromedriver' | grep -v grep || true

          echo ""
          echo "===== Listening ports ====="
          ss -ltnp || true

          echo ""
          echo "===== Selenium / Capybara configuration ====="
          sed -n '1,120p' spec/support/capybara.rb

          echo ""
          sed -n '70,95p' spec/rails_helper.rb

      - name: Run RSpec
        run: bundle exec rspec --order random

      - name: Upload Capybara screenshots and test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: capybara-failure
          path: |
            tmp/capybara/
            log/test.log

  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github
        